<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="100%" role="img" aria-labelledby="bsTitle bsDesc">
  <title id="bsTitle">Tech Stack &amp; Core Capabilities Strip</title>
  <desc id="bsDesc">Material 3 Expressive tonal chip bar: Python, TypeScript, Rust, Kotlin, Flutter, Tauri 2, Local-First by Default, and Agent Output Gates.</desc>
  <defs>
    <style>
      .m { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; }
      .s { font-family: ui-sans-serif, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1200" height="64" rx="20" fill="#141720" stroke="#2B3042" stroke-width="1.2"/>

  <!-- Chip 1: Python (Pill rx=19) -->
  <g transform="translate(18, 13)">
    <rect width="118" height="38" rx="19" fill="#1D2A44" stroke="#4565A3"/>
    <circle cx="20" cy="19" r="5" fill="#7CA8FF"/>
    <text class="m" fill="#D9E6FF" x="34" y="24">Python</text>
  </g>

  <!-- Chip 2: TypeScript (Squircle rx=11) -->
  <g transform="translate(148, 13)">
    <rect width="146" height="38" rx="11" fill="#1E2846" stroke="#4C63AB"/>
    <rect x="15" y="14" width="10" height="10" rx="3" fill="#9BB0FF"/>
    <text class="m" fill="#DDE2FF" x="34" y="24">TypeScript</text>
  </g>

  <!-- Chip 3: Rust (Pill rx=19) -->
  <g transform="translate(306, 13)">
    <rect width="106" height="38" rx="19" fill="#33201C" stroke="#7D4C42"/>
    <circle cx="20" cy="19" r="5" fill="#FFB4A8"/>
    <text class="m" fill="#FFDAD4" x="34" y="24">Rust</text>
  </g>

  <!-- Chip 4: Kotlin (Squircle rx=11) -->
  <g transform="translate(424, 13)">
    <rect width="116" height="38" rx="11" fill="#2A1F3D" stroke="#684D96"/>
    <rect x="15" y="14" width="10" height="10" rx="3" fill="#D9BFFF"/>
    <text class="m" fill="#EFE3FF" x="34" y="24">Kotlin</text>
  </g>

  <!-- Chip 5: Flutter (Pill rx=19) -->
  <g transform="translate(552, 13)">
    <rect width="122" height="38" rx="19" fill="#152E38" stroke="#35728A"/>
    <circle cx="20" cy="19" r="5" fill="#7AD9F5"/>
    <text class="m" fill="#CFEFFF" x="34" y="24">Flutter</text>
  </g>

  <!-- Chip 6: Tauri 2 (Squircle rx=11) -->
  <g transform="translate(686, 13)">
    <rect width="122" height="38" rx="11" fill="#16302B" stroke="#347568"/>
    <rect x="15" y="14" width="10" height="10" rx="3" fill="#66D9B8"/>
    <text class="m" fill="#C9F7E9" x="34" y="24">Tauri 2</text>
  </g>

  <!-- Chip 7: Local-first by default (Pill rx=19) -->
  <g transform="translate(820, 13)">
    <rect width="184" height="38" rx="19" fill="#292218" stroke="#7A5E3A"/>
    <circle cx="20" cy="19" r="5" fill="#FFB786"/>
    <text class="m" fill="#FFE4CF" x="34" y="24">local-first · 本机优先</text>
  </g>

  <!-- Chip 8: Agent Tooling & Gates (Squircle rx=11) -->
  <g transform="translate(1016, 13)">
    <rect width="166" height="38" rx="11" fill="#331B30" stroke="#85457D"/>
    <path d="M20 12 L23 17 L28 19 L23 21 L20 26 L17 21 L12 19 L17 17 Z" fill="#F5B2E0"/>
    <text class="m" fill="#FFD9F4" x="34" y="24">agent-gates · 门禁</text>
