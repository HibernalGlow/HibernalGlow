<svg xmlns="http://www.w3.org/2000/svg" width="580" height="448" viewBox="0 0 580 448" role="img" aria-labelledby="title desc" lang="en" font-family="'Google Sans Flex','Roboto Flex',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<title id="title">InkLoom — Weaving legal knowledge into playable animations</title>
<desc id="desc">Knowledge animation library for judicial exams: 396 animations, 1,682 scenes across 12 legal subjects. Depicts loom warp and weft, shuttle, and scene cards with deep interactive links on Netlify.</desc>
<defs><clipPath id="frame"><rect x="0" y="0" width="580" height="448" rx="40" fill="#fff"/></clipPath></defs>
<g clip-path="url(#frame)"><rect x="0" y="0" width="580" height="448" rx="40" fill="#f5eedf"/>
<text x="32" y="49" font-size="18" font-weight="700" fill="#b23a2e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">LEGAL KNOWLEDGE ANIMATIONS</text>
<text x="30" y="104" font-size="48" font-weight="800" fill="#29231b" data-maxw="516">InkLoom</text>
<text x="32" y="145" font-size="24" font-weight="600" fill="#3d352b" data-maxw="516">Weaving legal principles into playable scenes.</text>

<!-- Studio showcase box -->
<rect x="30" y="170" width="520" height="186" rx="30" fill="#fffdf8" stroke="#dfd4c0" stroke-width="1.5"/>

