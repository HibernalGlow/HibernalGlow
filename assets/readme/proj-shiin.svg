<svg xmlns="http://www.w3.org/2000/svg" width="580" height="448" viewBox="0 0 580 448" role="img" aria-labelledby="title desc" lang="zh-CN" font-family="'Google Sans Flex','Roboto Flex',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<title id="title">Shiin：手柄截图与 OBS 即时回放</title>
<desc id="desc">多端截图内核架构示意：手柄组合键与全局快捷键触发，由 Node 侧单实例 ScreenshotManager 统一调度，对外提供 Electron 桌面端、OpenTUI 终端、本地 Web 与 CLI 四大入口，输出文件并联动 OBS 保存回放缓存。</desc>
<defs><clipPath id="frame"><rect x="0" y="0" width="580" height="448" rx="40" fill="#fff"/></clipPath></defs>
<g clip-path="url(#frame)"><rect x="0" y="0" width="580" height="448" rx="40" fill="#12160f"/>
<text x="32" y="49" font-size="18" font-weight="700" fill="#c9f56d" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">GAMEPAD CAPTURE &amp; REPLAY</text>
<text x="30" y="103" font-size="50" font-weight="800" fill="#ede5d3">Shiin</text>
<text x="32" y="142" font-size="24" font-weight="600" fill="#ede5d3" data-maxw="516">用手柄捕捉这一帧，不用切回键盘。</text>

<!-- 01 Trigger -->
<rect x="32" y="174" width="138" height="182" rx="20" fill="#182013" stroke="#2d3824" stroke-width="1.5"/>
<g transform="translate(50 192)">
  <rect x="0" y="0" width="102" height="42" rx="14" fill="#242e1d"/>
  <path d="M22 21h12m-6-6v12" fill="none" stroke="#ede5d3" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="72" cy="17" r="3.5" fill="#c9f56d"/>
  <circle cx="82" cy="25" r="3.5" fill="#c9f56d"/>
</g>
<text x="48" y="262" font-size="16" font-weight="700" fill="#ede5d3">手柄组合键</text>
<rect x="48" y="274" width="80" height="24" rx="6" fill="#242e1d"/>
<text x="88" y="290" font-size="12" font-weight="700" fill="#c9f56d" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Combo/Axis</text>
<text x="48" y="324" font-size="13" font-weight="550" fill="#8f9984">全局热键 · CLI</text>

<!-- Connect 1 -->
<path d="M170 265L196 265" fill="none" stroke="#c9f56d" stroke-width="3" stroke-linecap="round"/>

<!-- 02 Shared Core -->
<rect x="196" y="174" width="206" height="182" rx="20" fill="#1b2416" stroke="#c9f56d" stroke-width="2"/>
<text x="214" y="202" font-size="13" font-weight="750" fill="#c9f56d" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">ScreenshotManager</text>
<text x="214" y="226" font-size="16" font-weight="700" fill="#ede5d3">共享截图内核</text>

<g transform="translate(210 240)">
  <rect x="0" y="0" width="84" height="30" rx="8" fill="#25321f"/>
  <text x="42" y="20" font-size="12" font-weight="650" fill="#ede5d3" text-anchor="middle">桌面端</text>
  <rect x="94" y="0" width="84" height="30" rx="8" fill="#25321f"/>
  <text x="136" y="20" font-size="12" font-weight="650" fill="#ede5d3" text-anchor="middle">OpenTUI</text>
  <rect x="0" y="38" width="84" height="30" rx="8" fill="#25321f"/>
  <text x="42" y="58" font-size="12" font-weight="650" fill="#ede5d3" text-anchor="middle">本地 Web</text>
  <rect x="94" y="38" width="84" height="30" rx="8" fill="#25321f"/>
  <text x="136" y="58" font-size="12" font-weight="650" fill="#ede5d3" text-anchor="middle">命令行 CLI</text>
</g>
<text x="299" y="338" font-size="12" font-weight="600" fill="#8f9984" text-anchor="middle">同一配置 · 统一调度</text>

<!-- Connect 2 -->
<path d="M402 265L428 265" fill="none" stroke="#c9f56d" stroke-width="3" stroke-linecap="round"/>

<!-- 03 Output -->
<rect x="428" y="174" width="120" height="182" rx="20" fill="#182013" stroke="#2d3824" stroke-width="1.5"/>
<g transform="translate(444 194)">
  <rect x="0" y="0" width="88" height="48" rx="8" fill="#242e1d" stroke="#3b4b30" stroke-width="1"/>
  <circle cx="44" cy="24" r="14" fill="none" stroke="#c9f56d" stroke-width="2"/>
  <circle cx="44" cy="24" r="5" fill="#a82f46"/>
</g>
<text x="444" y="266" font-size="15" font-weight="700" fill="#ede5d3">全屏 / 窗口</text>
<rect x="444" y="278" width="88" height="24" rx="6" fill="#381e24"/>
<text x="488" y="294" font-size="12" font-weight="700" fill="#ffb4ab" text-anchor="middle">OBS 回放</text>
<text x="444" y="328" font-size="13" font-weight="550" fill="#8f9984">长按写缓存</text>

<!-- Footer info -->
<text x="32" y="398" font-size="20" font-weight="650" fill="#c9f56d" data-maxw="516">一个截图内核，四个入口 · 联动 OBS 即时回放</text>
<text x="32" y="426" font-size="16" font-weight="600" fill="#8f9984" data-maxw="516">Node.js · Electron · OpenTUI · OBS WebSocket</text>
</g>
</svg>
