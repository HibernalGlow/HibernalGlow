<svg xmlns="http://www.w3.org/2000/svg" width="580" height="448" viewBox="0 0 580 448" role="img" aria-labelledby="title desc" lang="zh-CN" font-family="'Google Sans Flex','Roboto Flex',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<title id="title">本地生图：8 GB 显存上跑完 anima 采样与 SeedVR2 放大</title>
<desc id="desc">一张 1024×1536 的图由 45 步全扩散采样得到，再经 SeedVR2 分块放大到 2048×3072。LoRA 栈依次为 Masterpiece 0.8、Highres Aesthetic Boost 0.8、画风 1.0、角色 1.3；底模 silvermoonmixAnima v23 INT8，采样器 er_sde / beta57，CFG 4.0，显存 8 GB。</desc>
<defs><clipPath id="frame"><rect x="0" y="0" width="580" height="448" rx="40" fill="#fff"/></clipPath></defs>
<g clip-path="url(#frame)"><rect x="0" y="0" width="580" height="448" rx="40" fill="#e6dcff"/>
<text x="32" y="49" font-size="18" font-weight="700" fill="#5a3d8f" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">COMFYUI · ANIMA · SEEDVR2</text>
<text x="30" y="104" font-size="46" font-weight="800" fill="#241a3d" data-maxw="516">本地生图</text>
<text x="32" y="145" font-size="24" font-weight="600" fill="#241a3d" data-maxw="516">8 GB 显存，一张图走完采样与放大。</text>
