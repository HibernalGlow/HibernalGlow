<title id="title">hibernal — deep hibernation from the menu bar</title>
<desc id="desc">Conceptual macOS menu excerpt with a Deep hibernate action, plus a crescent moon. A Swift menu-bar tool invokes pmset through a privileged helper. The illustration describes the trigger and mechanism, not a guarantee that every device successfully hibernates.</desc>
