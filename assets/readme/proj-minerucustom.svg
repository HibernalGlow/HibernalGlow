<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340" width="100%" role="img" aria-labelledby="mcTitle mcDesc">
  <title id="mcTitle">MineruCustom — PDF to Markdown Post-Processing Pipeline</title>
  <desc id="mcDesc">Material 3 Expressive project card for MineruCustom: restores discarded blocks, rebuilds footnotes, injects page markers from middle.json to Markdown. 7 external stars including MinerU maintainer myhloli.</desc>

  <defs>
    <linearGradient id="mcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1512"/>
      <stop offset="100%" stop-color="#231B16"/>
    </linearGradient>
    <linearGradient id="mcAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5C3A1E"/>
      <stop offset="100%" stop-color="#3E2613"/>
    </linearGradient>
    <style>
      .s { font-family: ui-sans-serif, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .m { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- Card Outer Surface (MD3E corner-extra-large rx=26) -->
  <rect width="580" height="340" rx="26" fill="url(#mcBg)"/>
  <rect x="1" y="1" width="578" height="338" rx="25" fill="none" stroke="#523B2B" stroke-width="1.5"/>

  <!-- Top Header Zone -->
  <g transform="translate(24, 22)">
    <!-- Role / Stack Pill -->
    <rect x="0" y="0" width="166" height="28" rx="14" fill="#362417" stroke="#754E32"/>
    <circle cx="16" cy="14" r="4.5" fill="#FFB786"/>
    <text class="m" font-size="12" font-weight="700" fill="#FFDCC3" x="28" y="18">PYTHON · MINERU</text>

    <!-- External Star Highlight Pill -->
    <rect x="336" y="0" width="196" height="28" rx="14" fill="url(#mcAccent)" stroke="#A66E43"/>
    <text class="m" font-size="12" font-weight="700" fill="#FFE6D1" x="350" y="18">★ 7 EXT · incl. myhloli</text>

    <!-- Title & Subtitle -->
    <text class="s" font-size="28" font-weight="800" fill="#FFF0E5" x="0" y="64">MineruCustom</text>
    <text class="s" font-size="14.5" fill="#D4B8A5" x="0" y="90">PDF → Markdown 后处理：找回丢弃块、重建脚注、注入页码锚点</text>
  </g>

  <!-- Visual Diagram: Document Surgery Comparison (Before -> Pipeline -> After) -->
  <g transform="translate(24, 130)">
    <!-- Left Card: Raw MinerU middle.json -->
    <rect x="0" y="0" width="162" height="148" rx="18" fill="#241C18" stroke="#47352B"/>
    <text class="m" font-size="11.5" font-weight="700" fill="#E6A173" x="14" y="24">middle.json (原始)</text>
    <rect x="14" y="34" width="134" height="18" rx="5" fill="#332822"/>
    <text class="m" font-size="10.5" fill="#B59B8B" x="20" y="47">para_blocks [...]</text>

    <!-- Highlighted Rescued Block -->
    <rect x="14" y="58" width="134" height="36" rx="8" fill="#42221D" stroke="#B85D4D" stroke-dasharray="4 3"/>
    <text class="m" font-size="10.5" font-weight="700" fill="#FFB4A8" x="20" y="73">discarded_blocks</text>
    <text class="s" font-size="10.5" fill="#E89B8E" x="20" y="88">页脚脚注 / 边注被丢弃</text>

    <rect x="14" y="102" width="134" height="32" rx="8" fill="#2E231E"/>
    <text class="s" font-size="10.5" fill="#9E8475" x="20" y="122">无原始页码映射标记</text>

    <!-- Center: Expressive Morphing Squircle Surgery Node -->
    <g transform="translate(174, 14)">
      <path d="M0 60 L20 60" stroke="#FFB786" stroke-width="2"/>
      <rect x="20" y="6" width="136" height="108" rx="22" fill="#382415" stroke="#96633B" stroke-width="1.4"/>
      <text class="s" font-size="13" font-weight="700" fill="#FFE2CC" x="34" y="30">后处理三步恢复</text>

      <rect x="30" y="40" width="116" height="20" rx="10" fill="#24170D"/>
      <text class="m" font-size="10.5" fill="#FFB786" x="38" y="54">1. 捞回丢弃区块</text>

      <rect x="30" y="64" width="116" height="20" rx="10" fill="#24170D"/>
      <text class="m" font-size="10.5" fill="#FFB786" x="38" y="78">2. 正文⇄脚注缝合</text>

      <rect x="30" y="88" width="116" height="20" rx="10" fill="#24170D"/>
      <text class="m" font-size="10.5" fill="#FFB786" x="38" y="102">3. 嵌页码 + 调层级</text>

      <path d="M156 60 L174 60" stroke="#FFB786" stroke-width="2"/>
      <polygon points="178,60 170,55 170,65" fill="#FFB786"/>
    </g>

    <!-- Right Card: Clean Page-Marked Markdown -->
    <rect x="356" y="0" width="176" height="148" rx="18" fill="#212922" stroke="#3F6B4E"/>
    <text class="m" font-size="11.5" font-weight="700" fill="#8CE8B5" x="370" y="24">output.md (可回查)</text>

    <rect x="370" y="34" width="148" height="22" rx="11" fill="#163826" stroke="#39855B"/>
    <text class="m" font-size="10.5" font-weight="700" fill="#A1F5C6" x="380" y="49">&lt;!-- page: 042 --&gt;</text>

    <rect x="370" y="62" width="148" height="36" rx="8" fill="#18211A"/>
    <text class="m" font-size="10.5" fill="#D5EDE0" x="378" y="77">## 第二节 意思表示[^1]</text>
    <text class="s" font-size="10.5" fill="#8AB89E" x="378" y="92">标题嵌套经 marku 修复</text>

    <rect x="370" y="104" width="148" height="30" rx="8" fill="#152E20"/>
    <text class="m" font-size="10.5" fill="#8CE8B5" x="378" y="123">[^1]: 页脚脚注已归位</text>
  </g>

  <!-- Bottom Footer Strip -->
  <text class="m" font-size="12" fill="#B59B8B" x="24" y="310">法学教材与法考资料入库管线 · 每一条结论均可按页码翻回原书核对</text>
</svg>
