<svg xmlns="http://www.w3.org/2000/svg" width="580" height="448" viewBox="0 0 580 448" role="img" aria-labelledby="title desc" lang="en" font-family="'Google Sans Flex','Roboto Flex',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<title id="title">rossi — one source, one JS file</title>
<desc id="desc">Conceptual mechanism: a JS source file describing listing, search and images runs in Rust-side QuickJS, then supplies the Flutter reader. The three labels describe capabilities, not literal ABI entry-point names. The reader artwork contains no third-party comic content.</desc>
