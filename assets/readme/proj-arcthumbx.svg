<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340" width="100%" role="img" aria-labelledby="atTitle atDesc">
  <title id="atTitle">ArcThumbX — Archive Cover Thumbnails in Windows Explorer &amp; macOS Finder</title>
  <desc id="atDesc">Material 3 Expressive project card for ArcThumbX: Rust + Slint native shell thumbnail provider rendering CBZ, CBR, EPUB, FB2, and AZW3 covers directly in Windows Explorer and macOS Finder.</desc>

  <defs>
    <linearGradient id="atBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#1C2336"/>
    </linearGradient>
    <linearGradient id="atShell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#283A5E"/>
      <stop offset="100%" stop-color="#1C2942"/>
    </linearGradient>
    <style>
      .s { font-family: ui-sans-serif, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .m { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- Outer Card Surface -->
  <rect width="580" height="340" rx="26" fill="url(#atBg)"/>
  <rect x="1" y="1" width="578" height="338" rx="25" fill="none" stroke="#36486E" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(24, 22)">
    <rect x="0" y="0" width="168" height="28" rx="14" fill="#212E4A" stroke="#456099"/>
    <circle cx="16" cy="14" r="4.5" fill="#9ECAFF"/>
    <text class="m" font-size="12" font-weight="700" fill="#D6E8FF" x="28" y="18">RUST · SLINT GUI</text>

    <rect x="332" y="0" width="200" height="28" rx="14" fill="url(#atShell)" stroke="#5C82C4"/>
    <text class="m" font-size="12" font-weight="700" fill="#E5F0FF" x="348" y="18">WIN EXPLORER · MAC FINDER</text>

    <text class="s" font-size="28" font-weight="800" fill="#F0F6FF" x="0" y="64">ArcThumbX</text>
    <text class="s" font-size="14.5" fill="#A8BEDE" x="0" y="90">在 Windows 资源管理器与 macOS Finder 里直接渲染电子书与漫画归档封面</text>
  </g>

  <!-- Visual Diagram: 5 Format Pills -> Rust Shell Extractor -> Native OS File Manager Covers -->
  <g transform="translate(24, 130)">
    <!-- Left Column: 5 Supported Archive Formats -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="108" height="26" rx="13" fill="#22304D" stroke="#48659E"/>
      <text class="m" font-size="11.5" font-weight="700" fill="#CFE3FF" x="18" y="17">.CBZ (ZIP)</text>

      <rect x="0" y="30" width="108" height="26" rx="8" fill="#22304D" stroke="#48659E"/>
      <text class="m" font-size="11.5" font-weight="700" fill="#CFE3FF" x="18" y="47">.CBR (RAR)</text>

      <rect x="0" y="60" width="108" height="26" rx="13" fill="#22304D" stroke="#48659E"/>
      <text class="m" font-size="11.5" font-weight="700" fill="#CFE3FF" x="18" y="77">.EPUB</text>

      <rect x="0" y="90" width="108" height="26" rx="8" fill="#22304D" stroke="#48659E"/>
      <text class="m" font-size="11.5" font-weight="700" fill="#CFE3FF" x="18" y="107">.FB2</text>

      <rect x="0" y="120" width="108" height="26" rx="13" fill="#22304D" stroke="#48659E"/>
      <text class="m" font-size="11.5" font-weight="700" fill="#CFE3FF" x="18" y="137">.AZW3</text>
    </g>

    <!-- Connector -->
    <path d="M114 73 L140 73" stroke="#9ECAFF" stroke-width="2.2"/>
    <polygon points="144,73 136,68 136,78" fill="#9ECAFF"/>

    <!-- Center: Rust + Slint Native Handler -->
    <rect x="148" y="10" width="154" height="128" rx="22" fill="url(#atShell)" stroke="#6992DB" stroke-width="1.4"/>
    <text class="m" font-size="11" font-weight="700" fill="#A8CEFF" x="164" y="34">SHELL EXTENSION</text>
    <text class="s" font-size="13" font-weight="700" fill="#FFFFFF" x="164" y="56">流式定位首图/封面</text>
    <text class="s" font-size="11" fill="#C2DAFF" x="164" y="76">无需整包解压至磁盘</text>
    <rect x="164" y="90" width="122" height="34" rx="10" fill="#141E30"/>
    <text class="m" font-size="10.5" fill="#9ECAFF" x="174" y="111">Slint 配置面板</text>

    <!-- Connector -->
    <path d="M302 73 L328 73" stroke="#9ECAFF" stroke-width="2.2"/>
    <polygon points="332,73 324,68 324,78" fill="#9ECAFF"/>

    <!-- Right: OS File Manager Cover Preview Cards -->
    <rect x="336" y="0" width="196" height="148" rx="18" fill="#1A2438" stroke="#3B517D"/>
    <text class="m" font-size="11" font-weight="700" fill="#9ECAFF" x="352" y="22">Finder / Explorer 缩略图</text>

    <!-- Cover Card 1 -->
    <rect x="352" y="32" width="76" height="102" rx="12" fill="#263554" stroke="#5B7EC2"/>
    <rect x="360" y="40" width="60" height="64" rx="8" fill="#3B5587"/>
    <circle cx="390" cy="72" r="14" fill="#9ECAFF" opacity="0.35"/>
    <text class="m" font-size="9.5" font-weight="700" fill="#E5F0FF" x="364" y="120">book.epub</text>

    <!-- Cover Card 2 -->
    <rect x="440" y="32" width="76" height="102" rx="12" fill="#263554" stroke="#5B7EC2"/>
    <rect x="448" y="40" width="60" height="64" rx="8" fill="#463B78"/>
    <rect x="462" y="56" width="32" height="32" rx="8" fill="#D5B8FF" opacity="0.35"/>
    <text class="m" font-size="9.5" font-weight="700" fill="#E5F0FF" x="454" y="120">vol01.cbz</text>
  </g>

  <!-- Footer -->
  <text class="m" font-size="12" fill="#8AA5CC" x="24" y="310">系统级缩略图扩展 (COM IThumbnailProvider / QuickLook) · 原生低开销渲染</text>
</svg>
