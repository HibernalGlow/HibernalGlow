<svg xmlns="http://www.w3.org/2000/svg" width="580" height="448" viewBox="0 0 580 448" role="img" aria-labelledby="title desc" lang="en" font-family="'Google Sans Flex','Roboto Flex',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<title id="title">Local diffusion: anima sampling and SeedVR2 upscaling on 8 GB of VRAM</title>
<desc id="desc">A 1024×1536 frame sampled in 45 full-diffusion steps, then upscaled 2× by SeedVR2 to 2048×3072. LoRA stack: Masterpiece 0.8, Highres Aesthetic Boost 0.8, style 1.0, character 1.3. Base model silvermoonmixAnima v23 INT8, sampler er_sde / beta57, CFG 4.0, 8 GB VRAM.</desc>
<defs><clipPath id="frame"><rect x="0" y="0" width="580" height="448" rx="40" fill="#fff"/></clipPath></defs>
<g clip-path="url(#frame)"><rect x="0" y="0" width="580" height="448" rx="40" fill="#e6dcff"/>
<text x="32" y="49" font-size="18" font-weight="700" fill="#5a3d8f" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">COMFYUI · ANIMA · SEEDVR2</text>
<text x="30" y="104" font-size="46" font-weight="800" fill="#241a3d" data-maxw="516">Local Diffusion</text>
<text x="32" y="145" font-size="24" font-weight="600" fill="#241a3d" data-maxw="516">8 GB VRAM. Sample, then upscale 2×.</text>
<rect x="30" y="170" width="520" height="186" rx="32" fill="#fdf9ff"/>
<rect x="52" y="190" width="136" height="62" rx="18" fill="#ffffff" stroke="#cbb8f0" stroke-width="2"/>
<text x="120" y="216" font-size="15" font-weight="700" fill="#241a3d" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">1024×1536</text>
<text x="120" y="238" font-size="13" font-weight="600" fill="#5f5478" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">45 steps · cfg 4</text>
<path d="M194 221L212 221" fill="none" stroke="#8b6fd0" stroke-width="3" stroke-linecap="round"/>
<path d="M205 215.5l6.5 5.5-6.5 5.5" fill="none" stroke="#8b6fd0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="220" y="190" width="136" height="62" rx="18" fill="#6c48c8"/>
<text x="288" y="216" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">SeedVR2</text>
<text x="288" y="238" font-size="13" font-weight="600" fill="#e3d7ff" text-anchor="middle">2× tiled upscale</text>
<path d="M362 221L380 221" fill="none" stroke="#8b6fd0" stroke-width="3" stroke-linecap="round"/>
<path d="M373 215.5l6.5 5.5-6.5 5.5" fill="none" stroke="#8b6fd0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="388" y="190" width="136" height="62" rx="18" fill="#ffffff" stroke="#cbb8f0" stroke-width="2"/>
<text x="456" y="216" font-size="15" font-weight="700" fill="#241a3d" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">2048×3072</text>
<text x="456" y="238" font-size="13" font-weight="600" fill="#5f5478" text-anchor="middle">detail rebuilt</text>
<rect x="52" y="272" width="132" height="32" rx="10" fill="#eee6ff"/>
<text x="60" y="293" font-size="12" font-weight="700" fill="#4a2f92" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">masterpiece 0.8</text>
<rect x="192" y="272" width="118" height="32" rx="10" fill="#eee6ff"/>
<text x="200" y="293" font-size="12" font-weight="700" fill="#4a2f92" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">highres 0.8</text>
<rect x="318" y="272" width="104" height="32" rx="10" fill="#eee6ff"/>
<text x="326" y="293" font-size="12" font-weight="700" fill="#4a2f92" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">modare 1.0</text>
<rect x="430" y="272" width="98" height="32" rx="10" fill="#eee6ff"/>
<text x="438" y="293" font-size="12" font-weight="700" fill="#4a2f92" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">si 1.3</text>
<text x="52" y="337" font-size="14" font-weight="600" fill="#5f5478" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">silvermoonmixAnima v23 · INT8 · er_sde / beta57</text>
<text x="32" y="417" font-size="38" font-weight="800" fill="#5b35b0">45</text>
<text x="86" y="415" font-size="19" font-weight="600" fill="#5f5478">steps</text>
<text x="180" y="417" font-size="38" font-weight="800" fill="#2f6a55">2×</text>
<text x="245" y="415" font-size="19" font-weight="600" fill="#5f5478">upscale</text>
<text x="350" y="417" font-size="38" font-weight="800" fill="#5b35b0">8 GB</text>
