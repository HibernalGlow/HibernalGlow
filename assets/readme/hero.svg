<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">HibernalGlow：让真实文件变成能运行、能校验的工具</title>
  <desc id="heroDesc">HibernalGlow 制作文档、笔记和 AI 工具。画面以文件经过处理后进入桌面应用的插画，表现从真实材料到本地运行、结果可校验的工具链。</desc>

  <defs>
    <clipPath id="canvas"><rect width="1200" height="360" rx="28"/></clipPath>
    <filter id="paperShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="13" stdDeviation="12" flood-color="#0a0920" flood-opacity=".3"/>
    </filter>
  </defs>

  <g clip-path="url(#canvas)">
    <rect width="1200" height="360" fill="#211d3e"/>
    <path d="M616 360c48-85 116-138 191-148 75-10 118 52 190 48 69-4 126-74 203-106v206Z" fill="#393265"/>
    <path d="M1020-33c73 6 130 49 135 108 5 53-37 80-86 75-40-5-62-37-102-36-38 1-72 26-107 4-39-24-40-78-7-114 35-38 99-42 167-37Z" fill="#5d50c8"/>
    <path d="M687 46c34-26 83-18 105 13 18 26 9 52-17 65-27 14-51 6-71 16-23 11-44 24-64 5-25-24 10-77 47-99Z" fill="#ff796b"/>

    <!-- Name and message use a staggered scale, with the action word as the visual anchor. -->
    <g id="identity" transform="translate(64 0)">
      <path d="M0 38h23l12 12-12 12H0Z" fill="#c5f36b"/>
      <text x="9" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="750" fill="#211d3e">H</text>
      <text x="48" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="750" letter-spacing="-.7" fill="#fff8e9">HibernalGlow</text>

      <text y="142" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="43" font-weight="650" letter-spacing="-1.4" fill="#fff8e9">把真实文件</text>
      <text y="231" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="80" font-weight="800" letter-spacing="-4" fill="#c5f36b">跑<tspan fill="#fff8e9">起来。</tspan></text>
      <path d="M3 258c57 12 121 12 190-1" fill="none" stroke="#ff796b" stroke-width="7" stroke-linecap="round"/>
      <text y="294" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="19" font-weight="550" fill="#d5d0ea">文档、笔记与 AI 输出，在本机落地并且可校验。</text>
      <text y="326" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" letter-spacing="1.4" fill="#9993bd">TOOLS FOR DOCUMENTS, AGENTS &amp; DESKTOP</text>
    </g>

    <!-- A sheet of source material flows into a working desktop tool. -->
    <g id="file" transform="translate(696 57) rotate(-8 86 111)" filter="url(#paperShadow)">
      <path d="M17 0h112l42 42v174H17c-9 0-16-7-16-16V16C1 7 8 0 17 0Z" fill="#fff8e9"/>
      <path d="M129 0v28c0 8 6 14 14 14h28Z" fill="#e7dffb"/>
      <path d="M143 42 129 28" fill="none" stroke="#c7bcdf" stroke-width="2"/>
      <path d="M24 49h64" stroke="#5d50c8" stroke-width="8" stroke-linecap="round"/>
      <circle cx="27" cy="81" r="5" fill="#ff796b"/>
      <path d="M43 81h91M25 102h104M25 122h76" stroke="#aaa3c1" stroke-width="4" stroke-linecap="round"/>
      <path d="M25 150h36" stroke="#c5f36b" stroke-width="8" stroke-linecap="round"/>
      <path d="M25 171h96" stroke="#aaa3c1" stroke-width="4" stroke-linecap="round"/>
      <path d="m109 181 9 9 18-22" fill="none" stroke="#5d50c8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <path d="M862 186c38 12 53 41 73 47 14 4 28-1 39-13" fill="none" stroke="#c5f36b" stroke-width="8" stroke-linecap="round" stroke-dasharray="1 1"/>
    <path d="m963 213 15 7-13 12" fill="none" stroke="#c5f36b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <g id="desktop-tool" transform="translate(953 102) rotate(4 106 87)" filter="url(#paperShadow)">
      <path d="M17 0h183c10 0 18 8 18 18v130c0 10-8 18-18 18H17c-10 0-18-8-18-18V18C-1 8 7 0 17 0Z" fill="#342e65" stroke="#aaa0e7" stroke-width="2"/>
      <path d="M0 20c0-11 7-19 18-19h182c11 0 18 8 18 19v19H0Z" fill="#7164dc"/>
      <circle cx="18" cy="19" r="4" fill="#ffb36d"/>
      <circle cx="32" cy="19" r="4" fill="#c5f36b"/>
      <circle cx="46" cy="19" r="4" fill="#fff8e9"/>
      <path d="M23 60h71M23 78h49M23 96h81" stroke="#827bb0" stroke-width="6" stroke-linecap="round"/>
      <path d="M23 120h52" stroke="#ff796b" stroke-width="6" stroke-linecap="round"/>
      <path d="M164 87c-18 0-32 14-32 32s14 32 32 32 32-14 32-32-14-32-32-32Z" fill="#c5f36b"/>
      <path d="m150 119 10 10 19-22" fill="none" stroke="#29234f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <path d="m1124 57 7 15 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2Z" fill="#c5f36b"/>
    <path d="m904 276 5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2Z" fill="#ff796b"/>
  </g>
</svg>
