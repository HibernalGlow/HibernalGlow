<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">HibernalGlow：本地优先的文档与 AI 工具</title>
  <desc id="heroDesc">左侧是身份与一句话定位：把文档、笔记和 AI 输出做成能在本机运行且可校验的工具；右侧是三条可核验的事实：MineruCustom 的 7 个外部 Star、neoview 的 2828 次提交、skilloom 的 22 个技能与 10 个输出门禁；底部是一条处理链路：资料 → 带页码的 Markdown → 结构/语义门禁 → 可回查的交付。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111a2b"/>
      <stop offset="1" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="420" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect x="0" y="0" width="1200" height="3" fill="url(#rule)" opacity="0.9"/>

    <!-- 左侧：身份与定位 -->
    <g id="identity" transform="translate(64 58)">
      <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2.2" fill="#38bdf8">LOCAL-FIRST TOOLING   ·   DOCUMENTS &amp; AGENTS</text>

      <text y="70" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="58" font-weight="700" fill="#f8fafc">HibernalGlow</text>

      <text y="130" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="24" fill="#e2e8f0">把文档、笔记和 AI 输出，做成能在本机</text>
      <text y="166" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="24" fill="#e2e8f0">真正跑起来、并且每一步都能校验的工具。</text>

      <text y="206" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="18" fill="#94a3b8">Local-first tools for documents, agents, and the files they touch.</text>

      <text y="252" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#64748b">2027 届 · 本科在读   /   BUILT IN THE OPEN</text>
    </g>

    <!-- 右侧：三条可核验的事实 -->
    <g id="verified-facts" transform="translate(744 56)">
      <rect width="392" height="272" rx="18" fill="#0f1726" stroke="#1e2b45" stroke-width="1.5"/>

      <text x="32" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="1.6" fill="#64748b">VERIFIED, NOT CLAIMED</text>

      <g transform="translate(308 8) rotate(-6)">
        <rect width="40" height="40" rx="8" fill="#b4402f"/>
        <text x="20" y="28" text-anchor="middle" font-family="'Songti SC', 'Noto Serif SC', serif" font-size="22" font-weight="700" fill="#f8fafc">验</text>
      </g>

      <line x1="32" y1="52" x2="360" y2="52" stroke="#1e2b45" stroke-width="1"/>

      <g transform="translate(32 82)">
        <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#475569">01</text>
        <text x="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="32" font-weight="700" fill="#f8fafc">7</text>
        <text x="56" y="-2" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="20" fill="#e2e8f0">外部 Star · MineruCustom</text>
        <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="16" fill="#94a3b8">含 MinerU 维护者 myhloli 的一星</text>
      </g>

      <line x1="32" y1="126" x2="360" y2="126" stroke="#1e2b45" stroke-width="1" opacity="0.7"/>

      <g transform="translate(32 148)">
        <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#475569">02</text>
        <text x="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="32" font-weight="700" fill="#f8fafc">2,828</text>
        <text x="136" y="-2" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="20" fill="#e2e8f0">次提交 · neoview</text>
        <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="16" fill="#94a3b8">Tauri 2 + Svelte 5 + Rust</text>
      </g>

      <line x1="32" y1="192" x2="360" y2="192" stroke="#1e2b45" stroke-width="1" opacity="0.7"/>

      <g transform="translate(32 214)">
        <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#475569">03</text>
        <text x="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="32" font-weight="700" fill="#f8fafc">22 / 10</text>
        <text x="160" y="-2" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="20" fill="#e2e8f0">技能 / 门禁</text>
        <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="16" fill="#94a3b8">skilloom · 不合格的输出直接拒绝</text>
      </g>
    </g>

    <!-- 底部：横向机制带 -->
    <g id="mechanism" transform="translate(64 352)">
      <line x1="0" y1="0" x2="1072" y2="0" stroke="#1e2b45" stroke-width="1"/>

      <g transform="translate(0 26)">
        <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#475569">01</text>
        <text y="24" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="19" fill="#cbd5e1">PDF 与文档</text>
      </g>
      <text x="236" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#475569">→</text>

      <g transform="translate(276 26)">
        <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#475569">02</text>
        <text y="24" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="19" fill="#cbd5e1">带页码的 Markdown</text>
      </g>
      <text x="512" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#475569">→</text>

      <g transform="translate(540 26)">
        <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#475569">03</text>
        <text y="24" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="19" fill="#cbd5e1">结构 / 语义门禁</text>
      </g>
      <text x="730" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#475569">→</text>

      <g transform="translate(792 26)">
        <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#475569">04</text>
        <text y="24" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif" font-size="19" fill="#cbd5e1">可回查的交付</text>
      </g>
    </g>
  </g>
</svg>
