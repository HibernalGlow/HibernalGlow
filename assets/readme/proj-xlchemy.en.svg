<svg xmlns="http://www.w3.org/2000/svg" width="580" height="448" viewBox="0 0 580 448" role="img" aria-labelledby="title desc" lang="en" font-family="'Google Sans Flex','Roboto Flex',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
<title id="title">Xlchemy — batch conversion and native Mac builds</title>
<desc id="desc">Conceptual batch-conversion illustration: stacked images pass through Xlchemy into JPEG XL, AVIF and WebP. The profile and project README describe native Apple Silicon Mac packages and bundled encoder dependencies. No compression ratio is claimed.</desc>
