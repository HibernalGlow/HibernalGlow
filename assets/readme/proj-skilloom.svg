<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340" width="100%" role="img" aria-labelledby="skTitle skDesc">
  <title id="skTitle">skilloom — AI Agent Skills &amp; Output Quality Gates</title>
  <desc id="skDesc">Material 3 Expressive project card for skilloom: 22 public agent skills (including 7 legal-* skills) and 12 Python scripts (10 validation gates) with 119 passing self-tests.</desc>

  <defs>
    <linearGradient id="skBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1917"/>
      <stop offset="100%" stop-color="#142420"/>
    </linearGradient>
    <linearGradient id="skGate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E4D44"/>
      <stop offset="100%" stop-color="#13332D"/>
    </linearGradient>
    <style>
      .s { font-family: ui-sans-serif, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .m { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- Outer Card Surface -->
  <rect width="580" height="340" rx="26" fill="url(#skBg)"/>
  <rect x="1" y="1" width="578" height="338" rx="25" fill="none" stroke="#29524A" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(24, 22)">
    <rect x="0" y="0" width="172" height="28" rx="14" fill="#173831" stroke="#317567"/>
    <circle cx="16" cy="14" r="4.5" fill="#66D9B8"/>
    <text class="m" font-size="12" font-weight="700" fill="#B8F5E2" x="28" y="18">PYTHON · AGENT GATES</text>

    <rect x="336" y="0" width="196" height="28" rx="14" fill="#1A423A" stroke="#439E8B"/>
    <text class="m" font-size="12" font-weight="700" fill="#D0FFF0" x="350" y="18">251 COMMITS · 119 PASS</text>

    <text class="s" font-size="28" font-weight="800" fill="#E8FBF5" x="0" y="64">skilloom</text>
    <text class="s" font-size="14.5" fill="#9AC7BA" x="0" y="90">22 个 Agent 技能包 + 10 个门禁与校验脚本，落盘前拦截不合规产物</text>
  </g>

  <!-- Visual Diagram: Loom Threads -> 3-Gate Barrier -> Pass / Reject Split -->
  <g transform="translate(24, 130)">
    <!-- Left: Skill Bundles -->
    <rect x="0" y="0" width="150" height="148" rx="18" fill="#152622" stroke="#2C5249"/>
    <text class="m" font-size="11.5" font-weight="700" fill="#7FE6C6" x="14" y="24">22 SKILL.md 规范</text>

    <rect x="12" y="34" width="126" height="28" rx="10" fill="#1C3630" stroke="#3A7064"/>
    <text class="m" font-size="11" font-weight="700" fill="#C4F7E6" x="20" y="52">legal-* (7 法律技能)</text>

    <rect x="12" y="68" width="126" height="28" rx="10" fill="#182E29"/>
    <text class="m" font-size="10.5" fill="#8EC7B7" x="20" y="86">题目成稿 / 闪卡 / 笔记</text>

    <rect x="12" y="102" width="126" height="32" rx="10" fill="#182E29"/>
    <text class="m" font-size="10.5" fill="#8EC7B7" x="20" y="122">通用工作流与文档技能</text>

    <!-- Connector -->
    <path d="M150 74 L176 74" stroke="#66D9B8" stroke-width="2.2"/>
    <polygon points="180,74 172,69 172,79" fill="#66D9B8"/>

    <!-- Center: Expressive Gate Pillar -->
    <rect x="184" y="0" width="166" height="148" rx="22" fill="url(#skGate)" stroke="#4BB39E" stroke-width="1.4"/>
    <text class="s" font-size="13" font-weight="700" fill="#E0FFF6" x="202" y="26">Python 门禁校验器</text>

    <rect x="198" y="36" width="138" height="26" rx="8" fill="#0F2622"/>
    <text class="s" font-size="11.5" fill="#A5E8D5" x="208" y="53">① 标题层级与结构规范</text>

    <rect x="198" y="68" width="138" height="26" rx="8" fill="#0F2622"/>
    <text class="s" font-size="11.5" fill="#A5E8D5" x="208" y="85">② Mermaid 流程图语义</text>

    <rect x="198" y="100" width="138" height="34" rx="8" fill="#0F2622"/>
    <text class="m" font-size="11" font-weight="700" fill="#66D9B8" x="208" y="121">自测 119 项用例全通过</text>

    <!-- Split Branches: Pass vs Reject -->
    <path d="M350 48 L384 48" stroke="#66D9B8" stroke-width="2.2"/>
    <polygon points="388,48 380,43 380,53" fill="#66D9B8"/>

    <path d="M350 104 L384 104" stroke="#E57368" stroke-width="2.2" stroke-dasharray="5 4"/>
    <polygon points="388,104 380,99 380,109" fill="#E57368"/>

    <!-- Top Right: PASS Pill Card -->
    <rect x="392" y="12" width="140" height="62" rx="18" fill="#15382C" stroke="#45A886" stroke-width="1.3"/>
    <text class="m" font-size="14" font-weight="800" fill="#7FF5C8" x="408" y="38">✓ PASS 落盘</text>
    <text class="s" font-size="11.5" fill="#A8E6CF" x="408" y="58">合规成稿写入仓库</text>

    <!-- Bottom Right: REJECT Card -->
    <rect x="392" y="82" width="140" height="62" rx="18" fill="#381C1E" stroke="#A84C52" stroke-width="1.3"/>
    <text class="m" font-size="14" font-weight="800" fill="#FFA8AD" x="408" y="108">✗ REJECT 拒收</text>
    <text class="s" font-size="11.5" fill="#E69EA2" x="408" y="128">非零退出 + 报错定位</text>
  </g>

  <!-- Footer -->
  <text class="m" font-size="12" fill="#78A89B" x="24" y="310">$ python3 scripts/validate_legal_skills.py → 4 道门禁退出码 0</text>
</svg>
